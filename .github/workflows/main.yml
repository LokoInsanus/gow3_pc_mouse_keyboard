
name: Windows zip

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave empty to build only)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: windows-zip-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows package
    runs-on: windows-2025
    timeout-minutes: 150

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Keep LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          release: false
          update: true
          install: git patch
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p python:p
            vulkan-headers:p vulkan-loader:p vulkan-memory-allocator:p glslang:p
            sdl3:p fmt:p boost:p robin-map:p xxhash:p ffmpeg:p zydis:p
            spirv-tools:p spirv-headers:p spirv-cross:p

      - name: Build
        run: bash build.sh

      - name: Setup Windows Python
        uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.13"

      - name: Package
        env:
          PYTHON_EXE: ${{ steps.python.outputs.python-path }}
        run: |
          WINPYTHON=$(cygpath -u "$PYTHON_EXE") bash packaging/windows/package.sh
          test -s dist/gow3-windows.zip
          cd dist
          sha256sum -b gow3-windows.zip > gow3-windows.zip.sha256

      - name: Verify ZIP integrity
        run: |
          python -c "import zipfile; z=zipfile.ZipFile('dist/gow3-windows.zip'); bad=z.testzip(); print('ZIP OK' if bad is None else f'Corrupt file: {bad}'); raise SystemExit(bad is not None)"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: gow3-windows.zip
          path: |
            dist/gow3-windows.zip
            dist/gow3-windows.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Windows package
    needs: build
    if: inputs.tag != ''
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: gow3-windows.zip
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/gow3-windows.zip \
              dist/gow3-windows.zip.sha256 \
              --clobber
          else
            gh release create "$TAG" \
              --target "$SHA" \
              --prerelease \
              --title "Windows test build $TAG" \
              --notes "Automated Windows build. Extract gow3-windows.zip and run God of War III.exe."

            gh release upload "$TAG" \
              dist/gow3-windows.zip \
              dist/gow3-windows.zip.sha256
          fi
